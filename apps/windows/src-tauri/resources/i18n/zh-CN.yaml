# Android 端专用文案：scripts/i18n/build.mjs 以此生成
# apps/android/.../values{,-zh}/strings.xml（CI 漂移门拒绝手改生成物）。
# 点分 key 机械映射为资源名（a.b → a_b，点删除），如 status.disconnected
# → status_disconnected；叶子键名即资源名的后半段——重命名此处应
# 同步检视 apps/android 的 R.string.* 引用。文案统一改此段。
