[package]
name = "clash-edge"
version = "1.0.3"
description = "ClashEdge - Lightweight Clash Client for Windows"
authors = ["akaspyrean"]
edition = "2021"

[[bin]]
name = "ClashEdge"
path = "src/main.rs"

[build-dependencies]
# config-json5：tauri.conf.json 按 JSON5 解析，允许在配置里写注释（见 tauri.conf.json 顶部安全说明）。
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
# config-json5 与 tauri-build 对应启用，保证 cargo build 阶段与运行时都能解析带注释的配置。
tauri = { version = "2", features = ["common-controls-v6", "tray-icon", "config-json5"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = { version = "2", features = ["tracing"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

# devtools：Tauri 2 在 debug 构建自动启用 Web Inspector，release 构建
# 不需要该 feature——所有 open_devtools() 调用均用 #[cfg(debug_assertions)]
# 门控，release 不编译任何 devtools 调用面。移除 "devtools" feature 以消除
# release 二进制中不必要的调试/攻击面。

# P1-11：shell plugin 未使用（打开目录走 Rust command），移除以减少攻击面。
# fs plugin 保留但收紧权限：capabilities.json 中移除过宽的 Desktop/Documents/Downloads
# 读取权限，仅允许应用自身数据目录（通过 Rust command 完成文件操作）。
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
log = "0.4"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "stream", "rustls-tls-webpki-roots", "socks"] }
winreg = "0.11"
# 已作为传递依赖存在于 Cargo.lock（tauri/tokio 体系），无需新增下载。
# Win32_Networking_WinInet：写入系统代理注册表后通知 WinINet 立即刷新。
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet"] }
directories = "5"
once_cell = "1.19"
parking_lot = "0.12"
ipnet = "2"
base64 = "0.21"
rand = "0.8"
# Portable Updater 更新包完整性校验（SHA256，Cargo.lock 锁 0.10.9）
sha2 = "0.10"
# P0-6（Release Gate）：Portable Updater manifest 签名验证（minisign 兼容，
# verify-only，无私钥代码路径）。发布端用 minisign 对 portable-manifest.json
# 签名；客户端用内置公钥验签后才信任 manifest 内容。
minisign-verify = "0.2"
# 托盘图标运行时着色（系统代理开=绿 / 关=灰）；
# 已作为传递依赖存在于 Cargo.lock（image 0.25.10），无需新增下载。
image = { version = "0.25", default-features = false, features = ["png"] }
