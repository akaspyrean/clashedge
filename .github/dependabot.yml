version: 2
updates:
  - package-ecosystem: cargo
    directory: /apps/windows/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      rust-deps:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/windows
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-deps:
        patterns: ["*"]
        update-types:
          - minor
          - patch
