name: Build mihomo Android AAR

on:
  workflow_dispatch:
    inputs:
      mihomo-version:
        description: "mihomo version/tag to build (e.g., v1.19.33)"
        required: true
        default: "v1.19.33"
  workflow_call:
    inputs:
      mihomo-version:
        description: "mihomo version/tag to build (e.g., v1.19.33)"
        required: false
        default: "v1.19.33"
        type: string

permissions:
  contents: read

jobs:
  build-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIHOMO_VERSION: ${{ inputs.mihomo-version }}
      # golang.org/x/mobile@latest (which provides gomobile) requires Go >= 1.26
      GO_VERSION: "1.26"
      # Pinned so a future x/mobile release cannot raise the Go floor again
      X_MOBILE_VERSION: "v0.0.0-20261011034528-197770444867"
      NDK_VERSION: "27.0.12077973"
      ANDROID_API: "34"

    steps:
      - name: Checkout ClashEdge (for wrapper)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: clashedge

      - name: Checkout mihomo source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MetaCubeX/mihomo
          ref: ${{ env.MIHOMO_VERSION }}
          path: mihomo-source

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: clashedge/apps/android/mihomo-wrapper/go.mod

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "ndk;${{ env.NDK_VERSION }}"

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${X_MOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${X_MOBILE_VERSION}

      - name: Build AAR from wrapper
        working-directory: clashedge/apps/android/mihomo-wrapper
        run: |
          # go.mod already points at ../../../../mihomo-source, which resolves
          # to the mihomo-source checkout that sits next to the clashedge/ dir.
          go mod tidy
          # -tags cmfa is required: without it mihomo compiles the
          # android&&!cmfa variant, whose TUN listener insists on Android's
          # PackageManager (sing-tun reads /data/system/packages.xml, which
          # modern Android denies to apps) and whose path safety check rejects
          # the app's rule-provider files.
          gomobile bind -v -target=android -androidapi ${ANDROID_API} \
            -tags cmfa \
            -o mihomo-core.aar \
            .

      - name: Verify AAR
        working-directory: clashedge/apps/android/mihomo-wrapper
        run: |
          unzip -l mihomo-core.aar
          echo "AAR size: $(du -h mihomo-core.aar)"

      - name: Upload AAR as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mihomo-core-aar
          path: clashedge/apps/android/mihomo-wrapper/mihomo-core.aar
          retention-days: 30