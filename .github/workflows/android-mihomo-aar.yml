name: Build mihomo Android AAR

on:
  workflow_dispatch:
    inputs:
      mihomo-version:
        description: "mihomo version/tag to build (e.g., v1.19.33)"
        required: true
        default: "v1.19.33"
  workflow_call:
    inputs:
      mihomo-version:
        description: "mihomo version/tag to build (e.g., v1.19.33)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIHOMO_VERSION: ${{ inputs.mihomo-version }}
      # gomobile works best with Go 1.22; 1.23 has known issues with gomobile init
      GO_VERSION: "1.22"
      NDK_VERSION: "27.0.12077973"
      ANDROID_API: "34"

    steps:
      - name: Checkout ClashEdge (for wrapper)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: clashedge

      - name: Checkout mihomo source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MetaCubeX/mihomo
          ref: ${{ env.MIHOMO_VERSION }}
          path: mihomo-source

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: clashedge/apps/android/mihomo-wrapper/go.mod

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "ndk;${{ env.NDK_VERSION }}"

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init -ndk

      - name: Build AAR from wrapper
        working-directory: clashedge/apps/android/mihomo-wrapper
        run: |
          # Point go.mod at the checked-out mihomo source (three levels up to repo root)
          sed -i 's|replace github.com/metacubex/mihomo => .*|replace github.com/metacubex/mihomo => ../../../mihomo-source|' go.mod
          go mod tidy
          gomobile bind -v -target=android -androidapi ${ANDROID_API} \
            -o mihomo-core.aar \
            .

      - name: Verify AAR
        working-directory: clashedge/apps/android/mihomo-wrapper
        run: |
          unzip -l mihomo-core.aar
          echo "AAR size: $(du -h mihomo-core.aar)"

      - name: Upload AAR as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mihomo-core-aar
          path: clashedge/apps/android/mihomo-wrapper/mihomo-core.aar
          retention-days: 30