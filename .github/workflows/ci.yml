# CI — Rust unit tests + frontend typecheck & build on every push/PR.
# Keeps main green and catches regressions before release.
#
# 注意：push 仅限分支触发（branches: ["**"]）——tag push 不重复跑 CI，
# 发版时的 fmt/clippy/test 由 release.yml 自带，避免同一 commit 三个 action。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-scaffold/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-scaffold/src-tauri

      - name: npm ci
        working-directory: tauri-scaffold
        run: npm ci

      - name: cargo fmt --check
        working-directory: tauri-scaffold/src-tauri
        run: cargo fmt --check

      - name: cargo clippy (-D warnings)
        working-directory: tauri-scaffold/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: tauri-scaffold/src-tauri
        run: cargo test

      - name: npm run build
        working-directory: tauri-scaffold
        run: npm run build