# CI — Rust unit tests + frontend typecheck & build on every push/PR.
# Keeps main green and catches regressions before release.
#
# 注意：push 仅限分支触发（branches: ["**"]）——tag push 不重复跑 CI，
# 发版时的 fmt/clippy/test 由 release.yml 自带，避免同一 commit 三个 action。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# B2：CI 只需要读仓库内容，显式声明最小权限。
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # 去重：push.branches ["**"] 已覆盖同仓分支；同仓 PR 只跑 push 侧，
    # fork PR（push 触发不了）仍由 pull_request 事件运行。
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      # B2：所有 action 固定到官方 commit SHA，防止 tag 劫持。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-scaffold/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tauri-scaffold/src-tauri

      - name: npm ci
        working-directory: tauri-scaffold
        run: npm ci

      - name: cargo fmt --check
        working-directory: tauri-scaffold/src-tauri
        run: cargo fmt --check

      - name: cargo clippy (-D warnings)
        working-directory: tauri-scaffold/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: tauri-scaffold/src-tauri
        run: cargo test

      - name: cargo audit (known vulnerabilities)
        # cargo-audit 检查 Cargo.lock 中已公开的依赖漏洞。
        # 安装一次后缓存由 rust-cache 保留。
        run: |
          cargo install cargo-audit --locked 2>$null
          cargo audit

      - name: npm audit (high / critical)
        # 仅高优/严重漏洞才阻断 CI；低/中警告仅记录。
        working-directory: tauri-scaffold
        run: npm audit --audit-level=high

      - name: npm run build
        working-directory: tauri-scaffold
        run: npm run build