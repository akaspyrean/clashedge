# CI — push/PR 上的质量检查。
#
# P1-3 / Quality Gate single source: CI 与 Release 共用同一份 quality gate
# (scripts/ci/quality.ps1)。以前 CI 调用 reusable workflow、Release 内联
# 一套重复步骤，两套会漂移。现在统一调用 quality.ps1，保证
# "任何发布到的 commit 都过了同一套 fmt/clippy/test/audit/build"。
#
# 注意：push 仅限分支触发（branches: ["**"]）——tag push 不重复跑 CI，
# 发版时的 quality gate 由 release.yml 调用 quality.ps1 完成。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# B2：CI 只需要读仓库内容，显式声明最小权限。
permissions:
  contents: read

jobs:
  quality:
    # 去重：push.branches ["**"] 已覆盖同仓分支；同仓 PR 只跑 push 侧，
    # fork PR（push 触发不了）仍由 pull_request 事件运行。
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      # B2：所有 action 固定到官方 commit SHA，防止 tag 劫持。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/windows/src-tauri

      - name: "Quality Gate (single source: scripts/ci/quality.ps1)"
        shell: pwsh
        run: .\scripts\ci\quality.ps1
