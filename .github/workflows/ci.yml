# CI — push/PR 上的质量检查。
#
# Two-phase design:
#   lint-test  — fast gate for every push/PR (fmt, clippy, test, npm test,
#                design tokens, colour check, npm audit, android guard).
#                Skips cargo-audit/deny install, npm build, launcher compile.
#   build      — full gate only on push to main (everything in quality.ps1).
#                Release uses its own quality job (release.yml calls quality.ps1
#                without -Fast).
#
# push 仅限分支触发（branches: ["**"]）——tag push 不重复跑 CI。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/windows/src-tauri

      - name: "Quality Gate (fast: fmt/clippy/test/npm-test/tokens/audit)"
        shell: pwsh
        run: .\scripts\ci\quality.ps1 -Fast

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/windows/src-tauri

      - name: "Quality Gate (full: +cargo-audit/deny/npm-build/launcher)"
        shell: pwsh
        run: .\scripts\ci\quality.ps1
