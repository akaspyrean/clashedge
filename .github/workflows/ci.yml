# CI — push/PR 上的质量检查。
#
# P1-3：与 Release 共用同一份 quality gate（reusable workflow）。
# 以前 Release 只跑 cargo test，本地不经 main CI 直接打 tag 仍可能发布；
# 现在两边调用 quality-gate.yml，保证任何发布到的 commit 都过了同一套
# fmt/clippy/test/audit/build。
#
# 注意：push 仅限分支触发（branches: ["**"]）——tag push 不重复跑 CI，
# 发版时的 quality gate 由 release.yml 调用 quality-gate.yml 完成。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# B2：CI 只需要读仓库内容，显式声明最小权限。
permissions:
  contents: read

jobs:
  quality:
    # 去重：push.branches ["**"] 已覆盖同仓分支；同仓 PR 只跑 push 侧，
    # fork PR（push 触发不了）仍由 pull_request 事件运行。
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/quality-gate.yml
