name: Release

# Releases are tag-driven only: pushing a v* tag is the single release trigger.
# Tag immutability is enforced by the repository's GitHub Rulesets (immutable
# tags for v*), not by custom scripts — a pushed tag can never be moved or
# re-pointed, which removes the need for in-workflow tag guards.
#
# Privilege split (audit B10): everything that runs third-party code (npm ci,
# cargo build scripts, asset download) lives in `build` with a READ-ONLY token
# and NO private secrets (only the PUBLIC update-verification key is injected; the
# minisign private key and the Authenticode certificate are never visible here).
# Only `publish` - gated by the `release` GitHub Environment (configure required
# reviewers there) - holds contents:write, id-token/attestations, the minisign
# private key and the code-signing certificate, and it runs nothing but our own
# scripts plus the Tauri signer (installed with --ignore-scripts). Authenticode
# signing and manifest generation therefore happen in `publish`, on the ZIP that
# `build` produced.
on:
  # Primary release flow: run this workflow from the Actions UI and type
  # a v* tag (e.g. v0.2.0). The `prepare` job creates the tag at main HEAD
  # if it does not exist yet. This manual input is the ONLY way the release
  # version is controlled — no source file needs to be bumped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to cut and release (e.g. v0.2.0); created at main HEAD if missing"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A release run must not be interrupted: cancelling midway can leave a
  # half-published state (draft with partial assets / inconsistent signatures).
  cancel-in-progress: false

env:
  # Single ZIP name for the whole flow (matches scripts/windows/build-portable.ps1
  # and scripts/release/make-update-manifest.py ZIP_ASSET). Manifest, signature,
  # attestation and upload must all reference exactly this name.
  ZIP_NAME: ClashEdge-portable-win64.zip

jobs:
  # Resolves the release tag from the dispatch input, creates it at main
  # HEAD if it does not exist yet, and derives the version from it.
  # The dispatch input is the SINGLE control for the release version.
  # Downstream jobs check out this tag and reference needs.prepare.outputs.*.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve release tag (create at main HEAD on dispatch)
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Tag '$tag' must match v*"; exit 1 ;;
          esac
          version="${tag#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$tag' must be vx.y.z"; exit 1 ;;
          esac
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; releasing its commit."
            git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          else
            echo "Creating tag $tag at main HEAD."
            git checkout main
            git tag "$tag"
            git push origin "$tag"
          fi
          sha=$(git rev-parse "$tag^{commit}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # CI and Release share the same quality gate (scripts/ci/quality.ps1):
  # fmt/clippy/test/audit/build + launcher compile & recovery tests.
  # There is exactly one gate, not two.
  quality:
    needs: prepare
    runs-on: windows-latest
    steps:
      # Pin every action to the official commit SHA to prevent tag hijacking.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      # A v* tag pushed on some unreviewed branch must never reach the signing
      # job: the tagged commit has to be part of main's (protected) history.
      - name: Guard - tagged commit must be reachable from main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag ${{ needs.prepare.outputs.tag }} is not on main - refusing to release."
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      # Toolchain version comes from apps/windows/src-tauri/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/windows/src-tauri

      - name: "Quality Gate (single source: scripts/ci/quality.ps1)"
        shell: pwsh
        run: .\scripts\ci\quality.ps1

  build:
    needs: [prepare, quality]
    runs-on: windows-latest
    # No write access, no signing key: this job runs third-party build code.
    permissions:
      contents: read
    outputs:
      version: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      # No rust-cache here: a cache written by an earlier branch/PR run must not
      # be able to inject build outputs into a release artifact.

      # The client needs only the PUBLIC verification key at build time.
      # A release without it cannot update itself, so fail early.
      - name: Require update public key
        shell: pwsh
        env:
          CLASHEDGE_UPDATE_PUBKEY: ${{ secrets.CLASHEDGE_UPDATE_PUBKEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:CLASHEDGE_UPDATE_PUBKEY)) {
            throw "CLASHEDGE_UPDATE_PUBKEY is not set — client cannot verify manifests without the embedded public key"
          }

      - name: Install frontend dependencies
        working-directory: apps/windows
        run: npm ci

      # Inject the embedded update-verification public key into the client
      # build (update/mod.rs reads it at compile time).
      # CLASHEDGE_RELEASE_VERSION stamps the app version from the tag into the
      # binary (update/mod.rs::current_version); local dev builds report "dev".
      - name: Tauri release build (--no-bundle)
        working-directory: apps/windows
        env:
          CLASHEDGE_UPDATE_PUBKEY: ${{ secrets.CLASHEDGE_UPDATE_PUBKEY }}
          CLASHEDGE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle

      # Download and hash-verify pinned third-party assets (assets.lock.json):
      # mihomo core, wintun driver, rule sets and geodata -> build/assets/staging/.
      - name: Prepare third-party assets
        shell: pwsh
        run: .\scripts\assets\prepare.ps1

      # No signing secrets in this job (it ran third-party code above). The
      # unsigned ZIP is signed in the `publish` job.
      - name: Assemble portable package + SHA256 (unsigned)
        shell: pwsh
        run: .\scripts\windows\build-portable.ps1

      # Fault-injection test for the launcher (recovery kill points, native
      # junction, JSON/quoting, DefaultData sync). Any failure aborts the release.
      - name: Launcher recovery fault-injection test
        shell: pwsh
        run: |
          $launcher = ".\release\portable-out\ClashEdge.exe"
          if (-not (Test-Path $launcher)) { throw "Launcher not found: $launcher" }
          # ClashEdge.exe is a winexe (GUI subsystem): PowerShell's & operator
          # does not capture its exit code. Start-Process -Wait -PassThru does.
          $proc = Start-Process -FilePath $launcher -ArgumentList "--test-recovery" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Launcher recovery tests failed (exit $($proc.ExitCode))" }
          Write-Host "Launcher recovery tests passed."

      # Only the unsigned ZIP leaves this job; manifest, signatures and the
      # verification binary are all produced in `publish`.
      - name: Stage publish inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\publish-in | Out-Null
          Copy-Item ".\release\$env:ZIP_NAME" .\publish-in\
          Copy-Item ".\release\$env:ZIP_NAME.sha256" .\publish-in\

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs
          path: publish-in/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: windows-latest
    # Secrets (TAURI_SIGNING_*, WINDOWS_CODESIGN_*) should be defined on this
    # Environment, with required reviewers, rather than as repository secrets.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs
          path: release

      # --ignore-scripts: this job holds the signing key, so no dependency
      # lifecycle script may run here. The Tauri CLI signer needs none.
      - name: Install signer (no lifecycle scripts)
        working-directory: apps/windows
        run: npm ci --ignore-scripts

      # Authenticode-sign the binaries inside the ZIP built by the unprivileged job.
      # Skipped (with a warning) when no certificate is configured.
      - name: Authenticode-sign portable package
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: .\scripts\windows\sign-portable.ps1 -Zip ".\release\$env:ZIP_NAME"

      # The manifest must describe the FINAL (signed) ZIP, so it is generated here.
      - name: Generate Portable Updater manifest (unsigned)
        shell: pwsh
        run: |
          python3 scripts/release/make-update-manifest.py `
            --version "${{ needs.build.outputs.version }}" `
            --tag "${{ needs.prepare.outputs.tag }}" `
            --repo "akaspyrean/clashedge" `
            --dist ".\release" `
            --out ".\release\portable-manifest.json" `
            --notes "ClashEdge ${{ needs.build.outputs.version }}"

      # The exact client binary that embeds the public key verifies the signature below.
      - name: Extract client verifier from the ZIP
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "zipcheck"
          Expand-Archive ".\release\$env:ZIP_NAME" -DestinationPath $tmp -Force
          $inner = Get-ChildItem $tmp -Recurse -Filter ClashEdge.exe |
                   Where-Object { $_.FullName -match 'App[\\/]ClashEdge[\\/]ClashEdge\.exe$' } | Select-Object -First 1
          if (-not $inner) { throw "inner ClashEdge.exe not found in ZIP" }
          Copy-Item $inner.FullName ".\release\ClashEdge-inner.exe"

      # Create the draft release only now that everything upstream succeeded,
      # so a failing gate never leaves an empty draft behind. Only a leftover
      # draft from a previous failed run may be deleted and recreated; a
      # published release can never be reached here for the same tag.
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $raw = gh release view ${{ needs.prepare.outputs.tag }} --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $raw) {
            $existing = $raw | ConvertFrom-Json
            if ($existing.isDraft) {
              Write-Host "Leftover draft found — deleting and recreating."
              gh release delete ${{ needs.prepare.outputs.tag }} --yes
            } else {
              throw "Release ${{ needs.prepare.outputs.tag }} already exists and is published — refusing to overwrite."
            }
          }
          gh release create ${{ needs.prepare.outputs.tag }} `
            --target ${{ needs.prepare.outputs.sha }} `
            --title "${{ needs.prepare.outputs.tag }}" `
            --draft `
            --generate-notes

      # Sign portable-manifest.json with minisign via the Tauri CLI: it natively
      # supports the TAURI_SIGNING_* key format and password env vars (reliable
      # unattended). The output is a base64-wrapped signature; unwrap it to the
      # standard 4-line minisign text for client-side minisign-verify.
      - name: Sign update manifest (mandatory)
        shell: pwsh
        working-directory: apps/windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set — releases must be signed"
          }
          node node_modules/@tauri-apps/cli/tauri.js signer sign `
            "..\..\release\portable-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed" }
          $sig = "..\..\release\portable-manifest.json.sig"
          if (-not (Test-Path $sig)) { throw "signature file was not produced" }
          $raw = Get-Content $sig -Raw
          $decoded = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($raw.Trim()))
          if ($decoded -notmatch 'untrusted comment') { throw "unexpected signature format" }
          Set-Content -Path "..\..\release\portable-manifest.json.minisig" -Value $decoded -NoNewline
          Write-Host "Manifest signed and unwrapped to portable-manifest.json.minisig"

      # REAL verification: the client binary that embeds the public key must accept
      # the signature we just produced. If the private key and CLASHEDGE_UPDATE_PUBKEY
      # do not pair, every shipped client would reject every update forever.
      - name: Verify signature with the shipped client verifier
        shell: pwsh
        run: |
          $exe = ".\release\ClashEdge-inner.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "--verify-signature", ".\release\portable-manifest.json", ".\release\portable-manifest.json.minisig"
          ) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            $why = ""
            if (Test-Path ".\release\portable-manifest.json.verify-error.txt") {
              $why = Get-Content ".\release\portable-manifest.json.verify-error.txt" -Raw
            }
            throw "Signature does NOT verify with the embedded public key (exit $($proc.ExitCode)): $why"
          }
          Write-Host "Client-side signature verification passed."
          Remove-Item $exe -Force

      # Dry-run check: every file referenced by manifest, signature, SHA256,
      # attestation and upload must exist with a consistent hash — any mismatch
      # fails the release before anything is published.
      - name: Validate release artifacts (dry-run)
        shell: pwsh
        run: |
          $zip = ".\release\$env:ZIP_NAME"
          $sha = "$zip.sha256"
          $manifest = ".\release\portable-manifest.json"
          $sig = "$manifest.minisig"

          foreach ($f in @($zip, $sha, $manifest, $sig)) {
            if (-not (Test-Path $f)) { throw "Missing release artifact: $f" }
          }

          $actualZipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $shaLine = (Get-Content $sha -Raw).Trim()
          $shaFileHash = ($shaLine -split '\s+')[0].Trim()
          if (-not $shaFileHash.Equals($actualZipSha, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "ZIP sha256 file mismatch:`n  file says: $shaFileHash`n  actual:    $actualZipSha"
          }

          $m = Get-Content $manifest -Raw | ConvertFrom-Json
          if (-not $m.url.EndsWith("/$env:ZIP_NAME")) {
            throw "manifest url does not point at $env:ZIP_NAME : $($m.url)"
          }
          if ($m.sha256 -ne $actualZipSha) {
            throw "manifest sha256 mismatch with actual zip: $($m.sha256) vs $actualZipSha"
          }
          Write-Host "Release artifact dry-run validation passed:"
          Write-Host "  zip      : $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"
          Write-Host "  sha256   : $actualZipSha"
          Write-Host "  manifest : v$($m.version) -> $($m.url)"
          Write-Host "  signature: $sig"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/ClashEdge-portable-win64.zip
            release/portable-manifest.json
            release/portable-manifest.json.minisig

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = ".\release\$env:ZIP_NAME"
          $sha = "$zip.sha256"
          $manifest = ".\release\portable-manifest.json"
          $sig = "$manifest.minisig"
          foreach ($f in @($zip, $sha, $manifest, $sig)) {
            if (-not (Test-Path $f)) { throw "Upload source missing: $f" }
          }
          gh release upload ${{ needs.prepare.outputs.tag }} $zip $sha $manifest $sig --clobber

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ needs.prepare.outputs.tag }} --draft=false
