name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  # 发布流程不可中断：中途取消会留下半发布状态（draft/资产不全/签名不一致）。
  cancel-in-progress: false

env:
  # P0-5：全流程唯一 ZIP 文件名（与 scripts/windows/build-portable.ps1、
  # scripts/release/make-update-manifest.py 的 ZIP_ASSET 一致，不带版本号）。
  # manifest / 签名 / attestation / upload 只允许引用这一个名字。
  ZIP_NAME: ClashEdge-portable-win64.zip

jobs:
  # P1-3：先跑质量门（fmt/clippy/test/audit/npm test/build）。
  # 任一失败立即中止 release——避免发布"质量门没过"的版本。这是 Release
  # 与 CI 共用同一套检查的关键：本地不经 main CI 直接打 tag 时也会被卡住。
  quality:
    runs-on: windows-latest
    steps:
      # B2：所有 action 固定到官方 commit SHA，防止 tag 劫持。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/windows/src-tauri

      - name: npm ci
        working-directory: apps/windows
        run: npm ci

      - name: cargo fmt --check
        working-directory: apps/windows/src-tauri
        run: cargo fmt --check

      - name: cargo clippy (-D warnings)
        working-directory: apps/windows/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: apps/windows/src-tauri
        run: cargo test

      - name: cargo audit (known vulnerabilities)
        working-directory: apps/windows/src-tauri
        run: |
          cargo install cargo-audit --locked 2>$null
          cargo audit

      - name: npm audit (high / critical)
        working-directory: apps/windows
        run: npm audit --audit-level=high

      - name: npm test (Vitest unit + component tests)
        working-directory: apps/windows
        run: npm test

      - name: npm run build
        working-directory: apps/windows
        run: npm run build

  build:
    needs: quality
    runs-on: windows-latest

    steps:
      # B2：所有 action 固定到官方 commit SHA，防止 tag 劫持。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # Immutable release guard 需要在本地把 refs/tags/<tag>^{commit} 与
        # github.sha 比对（禁止移动/复用已发布标签）。默认浅克隆（depth=1）
        # 下 tag 对象图不完整、解析不可靠；本仓库体量小，fetch-depth: 0
        # 全量拉取成本可忽略，比守卫内按需 fetch 更简单可靠（守卫脚本
        # 仍保留按需 fetch / GitHub API 兜底，供浅克隆环境本地运行使用）。
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/windows/src-tauri

      # B1：快速失败守卫——workflow_dispatch 手动触发时 github.ref 是分支而非 tag，
      # 后续所有发布步骤都会产生错误的外部副作用（如以分支名创建公开 release）。
      # 在最前面直接终止，避免有人误触发后以为发版成功。
      - name: Guard — only run on v* tags
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notlike 'refs/tags/v*') {
            Write-Host "::error::Release workflow must be triggered by pushing a 'v*' tag, not by manual workflow_dispatch (ref: $env:GITHUB_REF)"
            exit 1
          }
          Write-Host "tag trigger confirmed: $env:GITHUB_REF"

      # B1：Immutable release guard —— 发布不可变守卫，位于一切外部副作用之前。
      # 判定逻辑在 scripts/release/Protect-ReleaseTag.ps1（由
      # scripts/release/test-release-guards.ps1 单元测试覆盖），防止三类
      # 发布安全事故：
      #   1) 重跑已正式发布（非 draft）的 tag —— 旧实现会先删除公开 Release，
      #      属于破坏性覆盖，现已禁止；
      #   2) 标签移动/复用 —— 同一 tag 必须永远指向同一 commit：
      #      refs/tags/<tag>^{commit} 必须等于 github.sha，否则立即失败；
      #   3) 既有 draft 与本次构建 commit 不一致 —— 不允许跨 commit 恢复。
      # 本步骤以 -WhatIfOnly 只读判定并把 decision 写入 GITHUB_OUTPUT，
      # 实际的 draft 删除重建只发生在后面的 "Create draft release" 步骤
      # （守卫步骤本身零副作用）。
      - name: Immutable release guard
        id: release-guard
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\release\Protect-ReleaseTag.ps1 `
            -Tag "${{ github.ref_name }}" `
            -Sha "${{ github.sha }}" `
            -Repo "${{ github.repository }}" `
            -WhatIfOnly `
            -SetGitHubOutput

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $raw = Get-Content .\apps\windows\src-tauri\tauri.conf.json -Encoding UTF8 -Raw
          $m = [regex]::Match($raw, '"version"\s*:\s*"([^"]+)"')
          if (-not $m.Success) { throw "Cannot extract version from tauri.conf.json" }
          Add-Content $env:GITHUB_OUTPUT "version=$($m.Groups[1].Value)"

      - name: Validate tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = "${{ steps.meta.outputs.version }}"
          if ($tag -ne "v$ver") {
            throw "tag '$tag' != 'v$ver' from tauri.conf.json — bump the config before tagging"
          }
          Write-Host "tag $tag matches config version $ver OK"

      # P0-6：更新清单签名是强制的。私钥或公钥缺失 => 立即失败，
      # 防止发布无法被客户端验签的更新包。
      - name: Require signing keys (mandatory)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CLASHEDGE_UPDATE_PUBKEY: ${{ secrets.CLASHEDGE_UPDATE_PUBKEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY -eq '' -or $null -eq $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set — releases must be signed (P0-6)"
          }
          if ($env:CLASHEDGE_UPDATE_PUBKEY -eq '' -or $null -eq $env:CLASHEDGE_UPDATE_PUBKEY) {
            throw "CLASHEDGE_UPDATE_PUBKEY is not set — client cannot verify manifests without the embedded public key (P0-6)"
          }
          Write-Host "Signing secrets present."

      # B1：创建 draft release 是外部副作用，仅允许 v* tag 触发。
      # 放在 quality gate 之后：quality 失败时不会留下空 draft。
      # 无条件 delete 已移除：仅当 Immutable release guard 判定既有 draft
      # 与本次构建指向同一 commit（decision=DELETE_RECREATE_DRAFT）时才删除
      # 重建（失败重跑的安全恢复场景）；已正式发布的 Release 绝不可能走到
      # 这里——守卫步骤已 exit 1。
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $decision = "${{ steps.release-guard.outputs.decision }}"
          if ($decision -eq 'DELETE_RECREATE_DRAFT') {
            gh release delete ${{ github.ref_name }} --yes
          } elseif ($decision -ne 'CREATE') {
            throw "Immutable release guard decision is '$decision' — refusing to create a release"
          }
          gh release create ${{ github.ref_name }} `
            --target ${{ github.sha }} `
            --title "${{ github.ref_name }}" `
            --draft `
            --generate-notes

      - name: Install frontend dependencies
        working-directory: apps/windows
        run: npm ci

      # P0-6：把内置验签公钥注入客户端构建（update/mod.rs 编译期读取）。
      - name: Tauri release build (--no-bundle)
        working-directory: apps/windows
        env:
          CLASHEDGE_UPDATE_PUBKEY: ${{ secrets.CLASHEDGE_UPDATE_PUBKEY }}
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle

      - name: Assemble portable package + SHA256
        run: .\scripts\windows\build-portable.ps1

      # P1-2：Launcher 故障注入测试纳入 Release CI。Launcher 已由上一步编译到
      # release/portable-out/ClashEdge.exe，在此立即跑 --test-recovery 验证
      # 5 个 kill 点（pending/verified/swapping/committed/nojournal）恢复行为，
      # 任一失败立即中止 release，避免发布"恢复逻辑有 bug"的版本。
      - name: Launcher recovery fault-injection test
        shell: pwsh
        run: |
          $launcher = ".\release\portable-out\ClashEdge.exe"
          if (-not (Test-Path $launcher)) { throw "Launcher not found: $launcher" }
          # ClashEdge.exe 是 winexe（GUI 子系统），PowerShell 的 & 运算符不捕获
          # 它的退出码（$LASTEXITCODE 为空）。用 Start-Process -Wait -PassThru
          # 正确获取 ExitCode。
          $proc = Start-Process -FilePath $launcher -ArgumentList "--test-recovery" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Launcher recovery tests failed (exit $($proc.ExitCode))" }
          Write-Host "Launcher recovery tests passed."

      - name: Generate Portable Updater manifest
        shell: pwsh
        run: |
          python3 scripts/release/make-update-manifest.py `
            --version "${{ steps.meta.outputs.version }}" `
            --tag "${{ github.ref_name }}" `
            --repo "akaspyrean/clashedge" `
            --dist ".\release" `
            --out ".\release\portable-manifest.json" `
            --notes "ClashEdge ${{ steps.meta.outputs.version }}"

      # P0-6：minisign 签名 portable-manifest.json。
      # 使用 Tauri CLI 签名：原生支持 TAURI_SIGNING_* 密钥格式与密码环境变量
      # （无人值守 CI 可靠，不依赖交互输密码）；产物为 base64 包裹的签名，
      # 解包成标准 minisign 4 行文本供客户端 minisign-verify 验证。
      - name: Sign update manifest (mandatory)
        shell: pwsh
        working-directory: apps/windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # CLI 自动读取 TAURI_SIGNING_PRIVATE_KEY / _PASSWORD 环境变量
          # working-directory 是 apps/windows（node_modules 在此）；release/ 在仓库根，
          # 需 `..\..\release`。旧值 `..\release` 是按平级布局写的（apps/windows 比
          # 原 tauri-scaffold 多一层），会指向不存在的 apps\release。
          node node_modules/@tauri-apps/cli/tauri.js signer sign `
            "..\..\release\portable-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed" }
          $sig = "..\..\release\portable-manifest.json.sig"
          if (-not (Test-Path $sig)) { throw "signature file was not produced" }
          # Tauri .sig = 整个 minisign 签名文件的一层 base64；解包为标准文本
          $raw = Get-Content $sig -Raw
          $decoded = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($raw.Trim()))
          if ($decoded -notmatch 'untrusted comment') { throw "unexpected signature format" }
          Set-Content -Path "..\..\release\portable-manifest.json.minisig" -Value $decoded -NoNewline
          Write-Host "Manifest signed and unwrapped to portable-manifest.json.minisig"

      # P0-5/P0-6 dry-run 校验：manifest、签名、SHA256、attest、upload
      # 引用的每一个文件都必须真实存在且哈希一致；任何一项不满足立即失败。
      - name: Validate release artifacts (dry-run)
        shell: pwsh
        run: |
          $zip = ".\release\$env:ZIP_NAME"
          $sha = "$zip.sha256"
          $manifest = ".\release\portable-manifest.json"
          $sig = "$manifest.minisig"

          foreach ($f in @($zip, $sha, $manifest, $sig)) {
            if (-not (Test-Path $f)) { throw "Missing release artifact: $f" }
          }

          # SHA256 文件必须与实际 ZIP 哈希一致（大小写不敏感：
          # build-portable.ps1 写入的是 Get-FileHash 的大写形式）
          $actualZipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $shaLine = (Get-Content $sha -Raw).Trim()
          $shaFileHash = ($shaLine -split '\s+')[0].Trim()
          if (-not $shaFileHash.Equals($actualZipSha, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "ZIP sha256 file mismatch:`n  file says: $shaFileHash`n  actual:    $actualZipSha"
          }

          # manifest 必须指向同一个真实存在的 ZIP 资产名，且内嵌哈希一致
          $m = Get-Content $manifest -Raw | ConvertFrom-Json
          if (-not $m.url.EndsWith("/$env:ZIP_NAME")) {
            throw "manifest url does not point at $env:ZIP_NAME : $($m.url)"
          }
          if ($m.sha256 -ne $actualZipSha) {
            throw "manifest sha256 mismatch with actual zip: $($m.sha256) vs $actualZipSha"
          }

          # attest 步骤的 subject 全部存在
          foreach ($f in @($zip, $manifest, $sig)) {
            if (-not (Test-Path $f)) { throw "Attest subject missing: $f" }
          }
          Write-Host "Release artifact dry-run validation passed:"
          Write-Host "  zip      : $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"
          Write-Host "  sha256   : $actualZipSha"
          Write-Host "  manifest : v$($m.version) -> $($m.url)"
          Write-Host "  signature: $sig"

      # B1：attest 是外部副作用（写入公共透明日志），仅允许 v* tag 触发。
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            release/ClashEdge-portable-win64.zip
            release/portable-manifest.json
            release/portable-manifest.json.minisig

      # B1：上传资产是外部副作用，仅允许 v* tag 触发。
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = ".\release\$env:ZIP_NAME"
          $sha = "$zip.sha256"
          $manifest = ".\release\portable-manifest.json"
          $sig = "$manifest.minisig"
          foreach ($f in @($zip, $sha, $manifest, $sig)) {
            if (-not (Test-Path $f)) { throw "Upload source missing: $f" }
          }
          gh release upload ${{ github.ref_name }} $zip $sha $manifest $sig --clobber

      # B1：publish（draft=false，公开发布）是外部副作用，仅允许 v* tag 触发。
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ github.ref_name }} --draft=false
