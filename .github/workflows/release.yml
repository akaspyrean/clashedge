name: Release

# Releases are tag-driven only: pushing a v* tag is the single release trigger.
# Tag immutability is enforced by the repository's GitHub Rulesets (immutable
# tags for v*), not by custom scripts — a pushed tag can never be moved or
# re-pointed, which removes the need for in-workflow tag guards.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  # A release run must not be interrupted: cancelling midway can leave a
  # half-published state (draft with partial assets / inconsistent signatures).
  cancel-in-progress: false

env:
  # Single ZIP name for the whole flow (matches scripts/windows/build-portable.ps1
  # and scripts/release/make-update-manifest.py ZIP_ASSET). Manifest, signature,
  # attestation and upload must all reference exactly this name.
  ZIP_NAME: ClashEdge-portable-win64.zip

jobs:
  # CI and Release share the same quality gate (scripts/ci/quality.ps1):
  # fmt/clippy/test/audit/build. There is exactly one gate, not two.
  quality:
    runs-on: windows-latest
    steps:
      # Pin every action to the official commit SHA to prevent tag hijacking.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/windows/src-tauri

      - name: "Quality Gate (single source: scripts/ci/quality.ps1)"
        shell: pwsh
        run: .\scripts\ci\quality.ps1

  build:
    needs: quality
    runs-on: windows-latest

    steps:
      # Pin every action to the official commit SHA to prevent tag hijacking.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/windows/src-tauri

      # A tag whose version diverges from tauri.conf.json would make the ZIP,
      # manifest and updater paths contradict each other — fail before any
      # external side effect.
      - name: Guard — tag version must match tauri.conf.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $raw = Get-Content .\apps\windows\src-tauri\tauri.conf.json -Encoding UTF8 -Raw
          $m = [regex]::Match($raw, '"version"\s*:\s*"([^"]+)"')
          if (-not $m.Success) { throw "Cannot extract version from tauri.conf.json" }
          $version = $m.Groups[1].Value
          if ($tag -ne "v$version") {
            throw "Tag '$tag' does not match tauri.conf.json version '$version' — bump the version or fix the tag."
          }
          Add-Content $env:GITHUB_OUTPUT "version=$version"
        id: meta

      # Manifest signing is mandatory: a release that clients cannot verify
      # must never ship. Missing keys fail the run immediately.
      - name: Require signing keys (mandatory)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CLASHEDGE_UPDATE_PUBKEY: ${{ secrets.CLASHEDGE_UPDATE_PUBKEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY -eq '' -or $null -eq $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set — releases must be signed"
          }
          if ($env:CLASHEDGE_UPDATE_PUBKEY -eq '' -or $null -eq $env:CLASHEDGE_UPDATE_PUBKEY) {
            throw "CLASHEDGE_UPDATE_PUBKEY is not set — client cannot verify manifests without the embedded public key"
          }
          Write-Host "Signing secrets present."

      # Create the draft release after the quality gate so a failing gate never
      # leaves an empty draft behind. Only a leftover draft from a previous
      # failed run may be deleted and recreated; a published release can never
      # be reached here for the same tag (immutable tags + no manual trigger).
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $raw = gh release view ${{ github.ref_name }} --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $raw) {
            $existing = $raw | ConvertFrom-Json
            if ($existing.isDraft) {
              Write-Host "Leftover draft found — deleting and recreating."
              gh release delete ${{ github.ref_name }} --yes
            } else {
              throw "Release ${{ github.ref_name }} already exists and is published — refusing to overwrite."
            }
          }
          gh release create ${{ github.ref_name }} `
            --target ${{ github.sha }} `
            --title "${{ github.ref_name }}" `
            --draft `
            --generate-notes

      - name: Install frontend dependencies
        working-directory: apps/windows
        run: npm ci

      # Inject the embedded update-verification public key into the client
      # build (update/mod.rs reads it at compile time).
      - name: Tauri release build (--no-bundle)
        working-directory: apps/windows
        env:
          CLASHEDGE_UPDATE_PUBKEY: ${{ secrets.CLASHEDGE_UPDATE_PUBKEY }}
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle

      # Download and hash-verify pinned third-party assets (assets.lock.json):
      # mihomo core, wintun driver and built-in rule sets -> build/assets/staging/.
      - name: Prepare third-party assets
        shell: pwsh
        run: .\scripts\assets\prepare.ps1

      - name: Assemble portable package + SHA256
        run: .\scripts\windows\build-portable.ps1

      # Fault-injection test for the launcher: verifies the 5 kill points
      # (pending/verified/swapping/committed/nojournal) recover correctly.
      # Any failure aborts the release — never ship a version whose recovery
      # logic is broken.
      - name: Launcher recovery fault-injection test
        shell: pwsh
        run: |
          $launcher = ".\release\portable-out\ClashEdge.exe"
          if (-not (Test-Path $launcher)) { throw "Launcher not found: $launcher" }
          # ClashEdge.exe is a winexe (GUI subsystem): PowerShell's & operator
          # does not capture its exit code. Start-Process -Wait -PassThru does.
          $proc = Start-Process -FilePath $launcher -ArgumentList "--test-recovery" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Launcher recovery tests failed (exit $($proc.ExitCode))" }
          Write-Host "Launcher recovery tests passed."

      - name: Generate Portable Updater manifest
        shell: pwsh
        run: |
          python3 scripts/release/make-update-manifest.py `
            --version "${{ steps.meta.outputs.version }}" `
            --tag "${{ github.ref_name }}" `
            --repo "akaspyrean/clashedge" `
            --dist ".\release" `
            --out ".\release\portable-manifest.json" `
            --notes "ClashEdge ${{ steps.meta.outputs.version }}"

      # Sign portable-manifest.json with minisign via the Tauri CLI: it natively
      # supports the TAURI_SIGNING_* key format and password env vars (reliable
      # unattended). The output is a base64-wrapped signature; unwrap it to the
      # standard 4-line minisign text for client-side minisign-verify.
      - name: Sign update manifest (mandatory)
        shell: pwsh
        working-directory: apps/windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node node_modules/@tauri-apps/cli/tauri.js signer sign `
            "..\..\release\portable-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed" }
          $sig = "..\..\release\portable-manifest.json.sig"
          if (-not (Test-Path $sig)) { throw "signature file was not produced" }
          $raw = Get-Content $sig -Raw
          $decoded = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($raw.Trim()))
          if ($decoded -notmatch 'untrusted comment') { throw "unexpected signature format" }
          Set-Content -Path "..\..\release\portable-manifest.json.minisig" -Value $decoded -NoNewline
          Write-Host "Manifest signed and unwrapped to portable-manifest.json.minisig"

      # Dry-run check: every file referenced by manifest, signature, SHA256,
      # attestation and upload must exist with a consistent hash — any mismatch
      # fails the release before anything is published.
      - name: Validate release artifacts (dry-run)
        shell: pwsh
        run: |
          $zip = ".\release\$env:ZIP_NAME"
          $sha = "$zip.sha256"
          $manifest = ".\release\portable-manifest.json"
          $sig = "$manifest.minisig"

          foreach ($f in @($zip, $sha, $manifest, $sig)) {
            if (-not (Test-Path $f)) { throw "Missing release artifact: $f" }
          }

          $actualZipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $shaLine = (Get-Content $sha -Raw).Trim()
          $shaFileHash = ($shaLine -split '\s+')[0].Trim()
          if (-not $shaFileHash.Equals($actualZipSha, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "ZIP sha256 file mismatch:`n  file says: $shaFileHash`n  actual:    $actualZipSha"
          }

          $m = Get-Content $manifest -Raw | ConvertFrom-Json
          if (-not $m.url.EndsWith("/$env:ZIP_NAME")) {
            throw "manifest url does not point at $env:ZIP_NAME : $($m.url)"
          }
          if ($m.sha256 -ne $actualZipSha) {
            throw "manifest sha256 mismatch with actual zip: $($m.sha256) vs $actualZipSha"
          }

          foreach ($f in @($zip, $manifest, $sig)) {
            if (-not (Test-Path $f)) { throw "Attest subject missing: $f" }
          }
          Write-Host "Release artifact dry-run validation passed:"
          Write-Host "  zip      : $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"
          Write-Host "  sha256   : $actualZipSha"
          Write-Host "  manifest : v$($m.version) -> $($m.url)"
          Write-Host "  signature: $sig"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            release/ClashEdge-portable-win64.zip
            release/portable-manifest.json
            release/portable-manifest.json.minisig

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = ".\release\$env:ZIP_NAME"
          $sha = "$zip.sha256"
          $manifest = ".\release\portable-manifest.json"
          $sig = "$manifest.minisig"
          foreach ($f in @($zip, $sha, $manifest, $sig)) {
            if (-not (Test-Path $f)) { throw "Upload source missing: $f" }
          }
          gh release upload ${{ github.ref_name }} $zip $sha $manifest $sig --clobber

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false
