name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-scaffold/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-scaffold/src-tauri

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $raw = Get-Content .\tauri-scaffold\src-tauri\tauri.conf.json -Encoding UTF8 -Raw
          $m = [regex]::Match($raw, '"version"\s*:\s*"([^"]+)"')
          if (-not $m.Success) { throw "Cannot extract version from tauri.conf.json" }
          Add-Content $env:GITHUB_OUTPUT "version=$($m.Groups[1].Value)"

      - name: Validate tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = "${{ steps.meta.outputs.version }}"
          if ($tag -ne "v$ver") {
            throw "tag '$tag' != 'v$ver' from tauri.conf.json — bump the config before tagging"
          }
          Write-Host "tag $tag matches config version $ver OK"

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} `
            --title "${{ github.ref_name }}" `
            --draft `
            --generate-notes

      - name: Install frontend dependencies
        working-directory: tauri-scaffold
        run: npm ci

      - name: Run Rust unit tests
        working-directory: tauri-scaffold/src-tauri
        run: cargo test

      - name: Tauri release build (--no-bundle)
        working-directory: tauri-scaffold
        run: npm run tauri -- build --no-bundle

      - name: Assemble portable package + SHA256
        run: .\tools\build-portable.ps1

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = ".\release\ClashEdge-portable-${{ steps.meta.outputs.version }}-win64.zip"
          $sha = "$zip.sha256"
          gh release upload ${{ github.ref_name }} $zip $sha
          gh release upload ${{ github.ref_name }} "$zip#ClashEdge-portable-win64.zip"

      - name: Check updater signing key
        id: check-key
        shell: pwsh
        run: |
          $hasKey = "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -ne ''
          Add-Content $env:GITHUB_OUTPUT "has_key=$hasKey"

      - name: Sign zip for auto-update (minisign)
        if: steps.check-key.outputs.has_key == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          choco install minisign -y --no-progress 2>$null
          $zip = ".\release\ClashEdge-portable-${{ steps.meta.outputs.version }}-win64.zip"
          $keyFile = "$env:RUNNER_TEMP\sign.key"
          $env:TAURI_SIGNING_PRIVATE_KEY -replace "`n","`n" | Set-Content -Path $keyFile -NoNewline
          minisign -M -s "$keyFile" -x "$zip.sig" -m "$zip" -W

      - name: Generate update manifest (latest.json)
        if: steps.check-key.outputs.has_key == 'true'
        shell: pwsh
        run: |
          python3 tools/make_update_manifest.py `
            --version "${{ steps.meta.outputs.version }}" `
            --tag "${{ github.ref_name }}" `
            --repo "akaspyrean/clashedge" `
            --dist ".\release" `
            --out ".\release\latest.json" `
            --notes "ClashEdge ${{ steps.meta.outputs.version }}"

      - name: Upload update artifacts
        if: steps.check-key.outputs.has_key == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} ".\release\latest.json"
          $sig = ".\release\ClashEdge-portable-${{ steps.meta.outputs.version }}-win64.zip.sig"
          if (Test-Path $sig) { gh release upload ${{ github.ref_name }} $sig }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ github.ref_name }} --draft=false