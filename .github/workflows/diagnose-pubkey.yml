name: Diagnose Update Pubkey

on:
  workflow_dispatch:

# Temporary diagnostic: both secrets turned out to be base64-wrapped minisign
# FILE TEXT (decoded first bytes "un" = "untrusted comment:"). This run unwraps
# that layer, parses the real key blobs and prints the DERIVED public key
# (public keys are non-secret). Never prints private key content. Delete after use.

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Unwrap base64-text secrets and derive public key
        env:
          PUBKEY_SECRET: ${{ secrets.CLASHEDGE_UPDATE_PUBKEY }}
          PRIVKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64, os, sys
          def b64dec(s):
              try: return base64.b64decode("".join(s.split()), validate=True)
              except Exception: return None
          def blob_pubkey(blob):
              # minisign key blob: [0:2] sig_alg | [2:4] kdf | [4:6] chk | [6:14] key_id | [14:46] ed25519 pub
              if blob is None or len(blob) < 46: return None
              return base64.b64encode(blob[0:2] + blob[6:14] + blob[14:46]).decode()
          def unwrap_to_pubkey(secret, label):
              print(f"--- {label} ---")
              ws = "".join(secret.split())
              text_bytes = b64dec(ws)
              if text_bytes is None:
                  print("outer base64 decode FAILED"); return None
              try: text = text_bytes.decode("utf-8")
              except Exception: print("decoded bytes are not utf-8 text"); return None
              lines = text.splitlines()
              print(f"unwrapped text: {len(text_bytes)} bytes, {len(lines)} lines")
              for i, l in enumerate(lines):
                  head = l[:20]
                  print(f"  line{i+1}: {len(l)} chars, starts {head!r}")
              # find the base64 key blob line (skips comment lines)
              for l in lines:
                  if l.startswith("untrusted comment") or l.startswith("trusted comment"): continue
                  blob = b64dec(l)
                  if blob is None: continue
                  print(f"  key blob: {len(blob)} bytes, first2={blob[:2].hex()}")
                  pk = blob_pubkey(blob)
                  if pk:
                      print(f"  DERIVED pubkey: {pk}  (len={len(pk)}, startsRW={pk.startswith('RW')})")
                      return pk
              print("  no usable key blob line found"); return None

          pub = os.environ.get("PUBKEY_SECRET","")
          print("=== CLASHEDGE_UPDATE_PUBKEY ===")
          pk_pub = unwrap_to_pubkey(pub, "pubkey secret") if pub else (print("EMPTY") or None)
          priv = os.environ.get("PRIVKEY","")
          print("\n=== TAURI_SIGNING_PRIVATE_KEY ===")
          pk_priv = unwrap_to_pubkey(priv, "private key secret") if priv else (print("EMPTY") or None)
          print("\n=== CONCLUSION ===")
          if pk_pub and pk_priv:
              print(f"pair match: {pk_pub == pk_priv}")
              print(f"set CLASHEDGE_UPDATE_PUBKEY to: {pk_priv}")
          elif pk_priv:
              print(f"set CLASHEDGE_UPDATE_PUBKEY to: {pk_priv}")
          elif pk_pub:
              print(f"set CLASHEDGE_UPDATE_PUBKEY to: {pk_pub}")
          else:
              print("could not derive a pubkey from either secret")
          PY
