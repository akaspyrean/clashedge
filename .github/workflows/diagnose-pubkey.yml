name: Diagnose Update Pubkey

on:
  workflow_dispatch:

# Temporary diagnostic: the two secrets are from DIFFERENT keypairs (key IDs
# b91bd8c9... vs 9987b1a6...). This run extracts the real public key that pairs
# with TAURI_SIGNING_PRIVATE_KEY by signing a known message and verifying
# candidate 32-byte chunks from the seckey blob (the pubkey is stored in
# plaintext inside the seckey). Prints only non-secret material. Delete after use.

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tauri signer CLI
        run: |
          mkdir -p /tmp/signer && cd /tmp/signer
          npm init -y >/dev/null 2>&1
          npm i @tauri-apps/cli >/dev/null 2>&1

      - name: Sign known message and extract pairing public key
        env:
          PRIVKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVKEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          printf 'clashedge-pairing-probe\n' > /tmp/probe.txt
          cd /tmp/signer
          TAURI_SIGNING_PRIVATE_KEY="$PRIVKEY" \
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$PRIVKEY_PASSWORD" \
            npx tauri signer sign /tmp/probe.txt 2>&1 | tail -2
          cd /
          python3 - <<'PY'
          import base64, hashlib, os, subprocess, sys
          try:
              from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
              from cryptography.exceptions import InvalidSignature
          except ImportError:
              subprocess.run([sys.executable, "-m", "pip", "install", "-q", "cryptography"], check=True)
              from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
              from cryptography.exceptions import InvalidSignature

          def b64dec(s):
              try: return base64.b64decode("".join(s.split()), validate=True)
              except Exception: return None

          priv = os.environ.get("PRIVKEY","")
          text = b64dec(priv).decode("utf-8", "replace")
          seckey_blob = None
          for l in text.splitlines():
              if l.startswith("untrusted comment") or l.startswith("trusted comment"): continue
              blob = b64dec(l)
              if blob is not None: seckey_blob = blob; break
          print(f"seckey blob: {len(seckey_blob)} bytes, sig_alg={seckey_blob[:2].hex()}")
          kid = seckey_blob[6:14]
          print(f"seckey key_id: {kid.hex()}")

          sig_text = open("/tmp/probe.txt.sig").read()
          decoded = b64dec(sig_text).decode("utf-8", "replace")
          sig_blob = None
          for l in decoded.splitlines():
              if l.startswith("untrusted comment") or l.startswith("trusted comment"): continue
              blob = b64dec(l)
              if blob is not None: sig_blob = blob; break
          sig_alg = sig_blob[:2]
          print(f"signature blob: {len(sig_blob)} bytes, alg={sig_alg.hex()} ({'prehashed ED' if sig_alg==b'ED' else 'legacy Ed'})")
          sig64 = sig_blob[10:74]
          sig_kid = sig_blob[2:10]
          print(f"signature key_id: {sig_kid.hex()}")
          print(f"seckey   key_id: {kid.hex()}")
          print(f"sig/seckey key_id match: {sig_kid == kid}")
          print(f"seckey kdf_alg={seckey_blob[2:4].hex()} chk_alg={seckey_blob[4:6].hex()} (5363='Sc' scrypt)")
          trusted = next((l for l in decoded.splitlines() if l.startswith('trusted comment')), '')
          print(f"trusted comment: {trusted[:60]!r}")

          msg = open("/tmp/probe.txt","rb").read()
          # brute-force: the 32-byte ed25519 pubkey lives in plaintext somewhere in the blob;
          # try multiple message/target variants
          variants = [
              ("raw", msg),
              ("raw-nostrip", msg.rstrip(b"\n")),
              ("blake2b-512", hashlib.blake2b(msg, digest_size=64).digest()),
              ("blake2b-512-nostrip", hashlib.blake2b(msg.rstrip(b"\n"), digest_size=64).digest()),
              ("sha512", hashlib.sha512(msg).digest()),
          ]
          found = None
          for i in range(0, len(seckey_blob) - 31):
              cand = seckey_blob[i:i+32]
              for name, t in variants:
                  try:
                      Ed25519PublicKey.from_public_bytes(cand).verify(sig64, t)
                      found = (i, cand, name); break
                  except Exception:
                      pass
              if found: break
          if not found:
              print("NO candidate chunk verifies — inspect format manually"); sys.exit(1)
          i, pub32, used_target = found
          print(f"\ned25519 public key found at seckey blob offset {i}")
          print(f"verified against: {used_target}")
          minisign_pub = b"Ed" + kid + pub32
          pk_b64 = base64.b64encode(minisign_pub).decode()
          print(f"\nCORRECT minisign public key (set CLASHEDGE_UPDATE_PUBKEY to this):")
          print(pk_b64)
          print(f"len={len(pk_b64)} startsRW={pk_b64.startswith('RW')}")
          print(f"\nalso valid as full minisign.pub text:")
          print(f"untrusted comment: ClashEdge updater\n{pk_b64}")
          PY
