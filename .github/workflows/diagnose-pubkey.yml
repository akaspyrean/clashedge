name: Diagnose Update Pubkey

on:
  workflow_dispatch:

# Temporary diagnostic: the signature made by TAURI_SIGNING_PRIVATE_KEY carries
# key_id b91bd8c9... which MATCHES CLASHEDGE_UPDATE_PUBKEY. This run proves the
# pair end-to-end: verify the probe signature against the pubkey secret's key
# (unwrapped from its base64-wrapped file text) — exactly what release publish
# will do once the code unwraps the base64 layer. Prints only non-secret
# material. Delete after use.

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tauri signer CLI
        run: |
          mkdir -p /tmp/signer && cd /tmp/signer
          npm init -y >/dev/null 2>&1
          npm i @tauri-apps/cli >/dev/null 2>&1

      - name: Verify probe signature against pubkey secret
        env:
          PRIVKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVKEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY_SECRET: ${{ secrets.CLASHEDGE_UPDATE_PUBKEY }}
        run: |
          printf 'clashedge-pairing-probe\n' > /tmp/probe.txt
          cd /tmp/signer
          TAURI_SIGNING_PRIVATE_KEY="$PRIVKEY" \
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$PRIVKEY_PASSWORD" \
            npx tauri signer sign /tmp/probe.txt 2>&1 | tail -2
          cd /
          python3 - <<'PY'
          import base64, hashlib, os, sys
          try:
              from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          except ImportError:
              import subprocess
              subprocess.run([sys.executable, "-m", "pip", "install", "-q", "cryptography"], check=True)
              from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          def b64dec(s):
              try: return base64.b64decode("".join(s.split()), validate=True)
              except Exception: return None

          # 1. the probe signature (made by the signing key, same as release publish does)
          decoded = b64dec(open("/tmp/probe.txt.sig").read()).decode("utf-8", "replace")
          sig_blob = next(b64dec(l) for l in decoded.splitlines()
                          if not l.startswith(("untrusted comment","trusted comment")) and b64dec(l))
          sig64 = sig_blob[10:74]
          print(f"signature: {len(sig_blob)} bytes, alg={sig_blob[:2].hex()}, key_id={sig_blob[2:10].hex()}")

          # 2. the pubkey secret's key: unwrap base64 -> line2 = 42-byte pubkey blob
          pub = os.environ.get("PUBKEY_SECRET","")
          t = b64dec(pub).decode("utf-8", "replace")
          print(f"pubkey secret unwrapped: {len(t)} bytes, {len(t.splitlines())} lines")
          pk_b64 = None
          for l in t.splitlines():
              if l.startswith(("untrusted comment","trusted comment")): continue
              b = b64dec(l)
              if b is not None and len(b) == 42:
                  pk_b64 = "".join(l.split()); break
          if pk_b64 is None:
              print("no 42-byte pubkey blob in the pubkey secret"); sys.exit(1)
          print(f"pubkey secret key: {pk_b64}")
          print(f"key_id match (sig vs pubkey): {sig_blob[2:10] == b64dec(pk_b64)[2:10]}")

          # 3. the definitive check — same math release publish will run
          msg = open("/tmp/probe.txt","rb").read()
          try:
              Ed25519PublicKey.from_public_bytes(b64dec(pk_b64)[10:42]).verify(
                  sig64, hashlib.blake2b(msg, digest_size=64).digest())
              print("\n=== PAIRING VERIFIED: release publish will PASS ===")
              print("=> the committed parse_update_pubkey (base64 unwrap) is sufficient.")
              print("=> CLASHEDGE_UPDATE_PUBKEY needs NO change; re-tag v1.1.0 to ship.")
          except Exception as e:
              print(f"\n=== PAIRING FAILED: {type(e).__name__} ===")
              print("=> set CLASHEDGE_UPDATE_PUBKEY to the matching pubkey of the signing key.")
          PY
