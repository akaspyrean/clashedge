# Android CI — Android 预览版的编译/静态检查/单测守卫。
#
# 背景：release.yml 里的 android-quality / android-build-unsigned 只有在发版
# （workflow_dispatch + v* tag）时才会运行，导致 Android 源码的编译错误可以
# 直接合入 main，直到下一次发版才暴露成红叉（见 PR #105）。
#
# 该工作流只在 Android 源码或本文件变更时触发，避免给纯 Windows/Rust 的改动
# 增加额外 CI 成本。它复用与 release.yml 完全相同的 JDK / SDK / Gradle 命令，
# 因此这里通过即代表发版链路不会再卡在同一处编译错误上。
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pin every action to the official commit SHA (same pins as release.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK pre-installed; install only what
      # AGP 8.5.2 + compileSdk 34 needs (same as release.yml).
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Run Android lint
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew lint --console=plain --no-daemon

      - name: Run Android unit tests
        working-directory: apps/android
        run: ./gradlew test --console=plain --no-daemon

      # assembleRelease is what android-build-unsigned does at release time;
      # verifying it here catches packaging/signing-config regressions early.
      - name: Build unsigned release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon
