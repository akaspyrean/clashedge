# Quality Gate — 共享质量检查（reusable workflow）。
#
# P1-3：CI 与 Release 原本各跑一套 quality 检查，但 Release 只跑 cargo test，
# 不跑 fmt/clippy/audit。本地创建一个不经 main CI 的 commit 直接打 tag →
# Release 仍可能发布。抽成 reusable workflow，两边都调用，保证
# "任何发布到的 commit 都过了同一套 fmt/clippy/test/audit/build"。
#
# 复用范围：可在 PR 与 Release 上下文共用的纯检查步骤。Release 专有的
# tauri build / 打包 / 签名 / 上传不在此处。
name: Quality Gate

on:
  workflow_call:
    inputs:
      node-version:
        type: number
        default: 20

# B2：纯检查，只读仓库内容。
permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      # B2：所有 action 固定到官方 commit SHA，防止 tag 劫持。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: tauri-scaffold/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tauri-scaffold/src-tauri

      - name: npm ci
        working-directory: tauri-scaffold
        run: npm ci

      - name: cargo fmt --check
        working-directory: tauri-scaffold/src-tauri
        run: cargo fmt --check

      - name: cargo clippy (-D warnings)
        working-directory: tauri-scaffold/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: tauri-scaffold/src-tauri
        run: cargo test

      - name: cargo audit (known vulnerabilities)
        # cargo-audit 检查 Cargo.lock 中已公开的依赖漏洞。
        # 安装一次后缓存由 rust-cache 保留。
        # working-directory 与 fmt/clippy/test 一致（Cargo.lock 在 src-tauri 下）。
        working-directory: tauri-scaffold/src-tauri
        run: |
          cargo install cargo-audit --locked 2>$null
          cargo audit

      - name: npm audit (high / critical)
        # 仅高优/严重漏洞才阻断 CI；低/中警告仅记录。
        working-directory: tauri-scaffold
        run: npm audit --audit-level=high

      - name: npm test (Vitest unit + component tests)
        # Pinia store 纯逻辑 + Vue 组件 v-if/v-else 渲染分支
        # （P1-4：补测试体系，避免类似 Connections v-else 回归再次漏入 main）
        working-directory: tauri-scaffold
        run: npm test

      - name: npm run build
        working-directory: tauri-scaffold
        run: npm run build
