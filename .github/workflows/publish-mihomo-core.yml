name: Publish Mihomo Core

# Publishes the Mihomo executable independently from ClashEdge app releases.
# The download job handles upstream data without signing credentials; only the
# gated publish job receives the minisign key.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream Mihomo version (for example 1.19.33); blank selects upstream latest"
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Resolve and download upstream core
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$CORE_VERSION_INPUT"
          if [[ -z "$version" ]]; then
            upstream_tag="$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)"
            version="${upstream_tag#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable Mihomo version in X.Y.Z form, got: $version" >&2
            exit 1
          fi
          upstream_tag="v$version"
          core_tag="mihomo-core-v$version"
          if git ls-remote --exit-code origin "refs/tags/$core_tag" >/dev/null 2>&1; then
            echo "Core release tag already exists: $core_tag" >&2
            exit 1
          fi

          work="$RUNNER_TEMP/mihomo-core"
          mkdir -p "$work/archive" "$work/extracted" release-core
          archive="mihomo-windows-amd64-compatible-v${version}.zip"
          gh release download "$upstream_tag" \
            --repo MetaCubeX/mihomo \
            --pattern "$archive" \
            --dir "$work/archive"
          unzip -oq "$work/archive/$archive" \
            mihomo-windows-amd64-compatible.exe \
            -d "$work/extracted"
          cp "$work/extracted/mihomo-windows-amd64-compatible.exe" \
            release-core/mihomo-core-win-x64.exe

          python3 - "$version" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          version = sys.argv[1]
          binary = pathlib.Path("release-core/mihomo-core-win-x64.exe")
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          manifest = {
              "version": version,
              "url": f"https://github.com/akaspyrean/clashedge/releases/download/mihomo-core-v{version}/mihomo-core-win-x64.exe",
              "sha256": digest,
              "notes": f"Mihomo core {version}",
          }
          pathlib.Path("release-core/mihomo-core-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$core_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mihomo-core-inputs
          path: release-core/
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mihomo-core-inputs
          path: release-core

      - name: Install signer and verifier
        working-directory: apps/windows
        run: |
          npm ci --ignore-scripts
          sudo apt-get update
          sudo apt-get install --yes minisign

      - name: Sign core manifest
        working-directory: apps/windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required to publish core updates" >&2
            exit 1
          fi
          node node_modules/@tauri-apps/cli/tauri.js signer sign \
            ../../release-core/mihomo-core-manifest.json
          node - <<'NODE'
          const fs = require("node:fs");
          const encoded = fs.readFileSync("../../release-core/mihomo-core-manifest.json.sig", "utf8").trim();
          const decoded = Buffer.from(encoded, "base64").toString("utf8");
          if (!decoded.includes("untrusted comment")) throw new Error("unexpected signer output");
          fs.writeFileSync("../../release-core/mihomo-core-manifest.json.minisig", decoded);
          NODE

      - name: Verify signed manifest
        env:
          CLASHEDGE_UPDATE_PUBKEY: ${{ secrets.CLASHEDGE_UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/minisign.pubkey"
          import base64
          import os

          raw = os.environ.get("CLASHEDGE_UPDATE_PUBKEY", "").strip()
          if not raw:
              raise SystemExit("CLASHEDGE_UPDATE_PUBKEY is required to verify the core manifest")

          def key_line(text):
              lines = [line.strip() for line in text.splitlines() if line.strip()]
              return next((line for line in lines if not line.startswith("untrusted comment")), None)

          candidate = key_line(raw)
          if candidate and len(candidate) == 56 and " " not in candidate:
              print(candidate)
          else:
              try:
                  decoded = base64.b64decode("".join(raw.split()), validate=True).decode("utf-8")
              except Exception as error:
                  raise SystemExit(f"Cannot decode CLASHEDGE_UPDATE_PUBKEY: {error}")
              candidate = key_line(decoded)
              if not candidate:
                  raise SystemExit("CLASHEDGE_UPDATE_PUBKEY contains no minisign public key")
              print(candidate)
          PY
          pubkey="$(cat "$RUNNER_TEMP/minisign.pubkey")"
          minisign -Vm release-core/mihomo-core-manifest.json \
            -P "$pubkey" \
            -x release-core/mihomo-core-manifest.json.minisig

      - name: Publish versioned core release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_VERSION: ${{ needs.prepare.outputs.version }}
          CORE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$CORE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mihomo Core v$CORE_VERSION" \
            --notes "Signed Mihomo core update channel. This release is independent from ClashEdge app releases." \
            --prerelease \
            release-core/mihomo-core-win-x64.exe \
            release-core/mihomo-core-manifest.json \
            release-core/mihomo-core-manifest.json.minisig
