name: Auto-update mihomo AAR

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 02:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if version unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current mihomo version
        id: current
        run: |
          CURRENT=$(grep 'github.com/metacubex/mihomo' apps/android/mihomo-wrapper/go.mod | sed 's/.*v\([^ ]*\).*/\1/')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Get latest mihomo release
        id: latest
        run: |
          LATEST=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.current }}" = "${{ steps.latest.outputs.latest }}" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "new_version=" >> $GITHUB_OUTPUT
            echo "No update needed"
          else
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "new_version=${{ steps.latest.outputs.latest }}" >> $GITHUB_OUTPUT
            echo "Update available: ${{ steps.current.outputs.current }} -> ${{ steps.latest.outputs.latest }}"
          fi

      - name: Update go.mod
        if: steps.check.outputs.update_needed == 'true'
        run: |
          cd apps/android/mihomo-wrapper
          sed -i "s/github.com\/metacubex\/mihomo v.*/github.com\/metacubex\/mihomo ${{ steps.check.outputs.new_version }}/" go.mod
          go mod tidy

      - name: Build AAR
        id: build
        if: steps.check.outputs.update_needed == 'true'
        run: |
          # Setup Go
          go_version="1.22"
          go install golang.org/x/mobile/cmd/gomobile@latest
          ~/go/bin/gomobile init -ndk

          # Checkout mihomo source
          git clone --depth 1 --branch ${{ steps.check.outputs.new_version }} https://github.com/MetaCubeX/mihomo.git mihomo-source

          # Build AAR from wrapper
          cd apps/android/mihomo-wrapper
          sed -i 's|replace github.com/metacubex/mihomo => .*|replace github.com/metacubex/mihomo => ../../mihomo-source|' go.mod
          ~/go/bin/gomobile bind -v -target=android -o mihomo-core.aar .

          # Verify
          unzip -l mihomo-core.aar
          echo "AAR size: $(du -h mihomo-core.aar)"

      - name: Commit go.mod change
        if: steps.check.outputs.update_needed == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/mihomo-wrapper/go.mod apps/android/mihomo-wrapper/go.sum
          git commit -m "chore: update mihomo to ${{ steps.check.outputs.new_version }} [skip ci]"
          git push

      - name: Upload AAR artifact
        if: steps.check.outputs.update_needed == 'true' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mihomo-core-aar
          path: apps/android/mihomo-wrapper/mihomo-core.aar
          retention-days: 30

      - name: Create issue on build failure
        if: steps.check.outputs.update_needed == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: 'akaspyrean',
              repo: 'clashedge',
              title: `⚠️ mihomo ${{ steps.check.outputs.new_version }} AAR build failed - API breaking changes`,
              body: `Automated update to mihomo ${{ steps.check.outputs.new_version }} failed due to API changes in wrapper.go.\n\n**Action required:**\n1. Check build logs for compilation errors\n2. Update \`apps/android/mihomo-wrapper/wrapper.go\` to match new mihomo API\n3. Manually trigger \`Build mihomo Android AAR\` workflow after fix\n\nCurrent version: ${{ steps.current.outputs.current }}\nTarget version: ${{ steps.check.outputs.new_version }}`,
              labels: ['android', 'mihomo', 'automation-failed']
            })