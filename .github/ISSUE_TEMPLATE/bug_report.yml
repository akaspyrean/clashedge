name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        If this is a security vulnerability, please use **Security → Report a vulnerability** instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Open ClashEdge
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ClashEdge version
      description: Check Help → About or the release page.
      placeholder: "v0.1.1"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant log output (redact sensitive info).
      render: shell
