# Mixed subscription: inline proxies + proxy-providers.
# The normalizer collects top-level proxies first, then expands and appends
# provider nodes (prefixed with the provider name to avoid collisions).
# Sanitized: all server addresses, passwords, and UUIDs are fake.
proxies:
  - name: Direct-SS-01
    type: ss
    server: 1.2.3.4
    port: 8388
    cipher: aes-128-gcm
    password: test-password
  - name: Direct-VMess-01
    type: vmess
    server: example.com
    port: 443
    uuid: 11111111-1111-1111-1111-111111111111
    cipher: auto
proxy-providers:
  InlineProvider:
    type: inline
    proxies:
      - name: Provided-VLESS-01
        type: vless
        server: 5.6.7.8
        port: 443
        uuid: 22222222-2222-2222-2222-222222222222
      - name: Provided-Trojan-01
        type: trojan
        server: example.org
        port: 443
        password: test-password
